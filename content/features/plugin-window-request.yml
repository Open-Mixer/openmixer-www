card:
  en:
    title: The plugin's own window, when you ask
    line: A plugin hosted by plugin-hostd can show its own window and hide it again, as jalv and mod-host do.
    text: Two verbs, show_external_ui and hide_external_ui, go from the controller through the daemon to the worker that holds the plugin. A daemon with no display refuses them by name. A window you showed comes back after a worker restart, and one you hid stays hidden.
  ca:
    title: La finestra del plugin, quan la demanes
    line: Un plugin allotjat per plugin-hostd pot mostrar la seva finestra i amagar-la, com fan jalv i mod-host.
    text: Dos verbs, show_external_ui i hide_external_ui, van del controlador, a través del dimoni, al worker que té el plugin. Un dimoni sense pantalla els refusa pel seu nom. Una finestra que has mostrat torna després de reiniciar un worker, i una que has amagat continua amagada.
