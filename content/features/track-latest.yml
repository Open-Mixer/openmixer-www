card:
  en:
    title: The device follows the releases
    line: Zynthian's own updater takes our signed release tags and never steps a device back.
    text: It takes only a signed tag that contains what the device already runs, and upgrades the packages in the same run, so the pieces always match.
  ca:
    title: L'aparell segueix les versions
    line: L'actualitzador propi de Zynthian agafa les nostres etiquetes de versió signades i mai fa recular un aparell.
    text: Només agafa una etiqueta signada que conté el que l'aparell ja executa, i actualitza els paquets en la mateixa passada, de manera que les peces sempre quadren.
