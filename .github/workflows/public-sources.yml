name: public-sources
# The fast checks, on every pull request: the trigger gate (no other workflow of this repository runs on a push or a
# pull request). The shared checks from Open-Mixer/.github join it once this repository passes them (#49). The builds,
# the test suites, the packages and the fuzzing are in the other workflows, run by workflow_dispatch (ci.yml on a pull
# request's head before it is merged) and on a v* tag.
on:
  pull_request:
concurrency:
  group: public-sources-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  trigger-gate:
    name: only this workflow runs on a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/trigger-gate@openmixer-v1
        with:
          lint-workflow: public-sources.yml

  # The site's own pages, its catalogs and its README name Open-Mixer and OpenMixer, never the former name. The project
  # documents under content/projects are copies, each equal to its file at the commit projects.json pins, and each
  # project's own old-name job reads the original; the what's-new entries are the site's history.
  old-name:
    name: no page names the former organisation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Open-Mixer/.github/.github/actions/old-name-check@openmixer-v1
        with:
          paths: app/pages app/components i18n content :!content/projects :!i18n/locales/*/whatsNew.json

  pr-fixes-issue:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Open-Mixer/.github/.github/workflows/pr-fixes-issue.yml@openmixer-v1
